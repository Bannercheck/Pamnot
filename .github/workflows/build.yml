# Checks every push and builds test copies of Pamnot for each platform.
#
# Android and web build on every push. The macOS, iOS and Windows jobs use
# runners that cost more Actions minutes (macOS counts 10x), so they run on
# main, on tags, when started by hand, or when a commit message contains
# [full-build].
#
# Every action is pinned to the full commit SHA of the tag named in its
# comment, so a moved tag cannot change what runs here.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The workflow token only reads the repository: no job pushes, comments or
# releases (upload-artifact uses its own runtime token).
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: iOS ayar ve varlık denetimleri
        run: |
          python3 tool/ios/check_ios_config.py
          python3 tool/ios/check_launch_assets.py
          python3 tool/ci/check_docs.py

  android:
    name: Android APK
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pamnot-android
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  web:
    name: Web
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pamnot-web
          path: build/web
          if-no-files-found: error

  macos:
    name: macOS app
    needs: checks
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-build]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Zip the app
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/Pamnot.app Pamnot-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pamnot-macos
          path: Pamnot-macos.zip
          if-no-files-found: error

  # Runs after the macOS app job, never beside it. Queued together, this job
  # never got a macOS runner and was cancelled after 15 minutes while
  # `macos` ran (runs 45242486935 and 45248971344): the account seems to
  # get one hosted macOS runner at a time. It only waits for `macos`, so it
  # still runs when that build fails; same trigger as `macos`.
  ios:
    name: iOS compile check
    needs: [checks, macos]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-build]')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Plist ve metin dosyalarını denetle
        run: |
          plutil -lint ios/Runner.xcodeproj/project.pbxproj ios/Runner/Info.plist \
            ios/Runner/PrivacyInfo.xcprivacy ios/Runner/*.lproj/*.strings
      # Installing on a device needs signing in Xcode; this proves the app
      # compiles for iOS.
      - run: flutter build ios --release --no-codesign
      # Kestirme sessizce kaybolmasın: App Intents meta verisi çıkarılmış olmalı,
      # ve kestirme uygulamayı öne açmalı (openAppWhenRun, iOS 26 SDK'da
      # kullanımdan kalkmış bir uzantıda; çıkarılmadıysa kestirme arka planda
      # çalışır ve ekran açılmaz).
      # Her denetim kendi satırında: `bash -e`, `a && b` zincirinde `a` başarısız
      # olunca durmaz, adım son satırın sonucuyla geçerdi.
      - name: Kestirme ve gizlilik bildirimi derlemede var mı
        run: |
          f=$(find build/ios -name extract.actionsdata | head -1)
          test -n "$f"
          grep -q VoiceTaskIntent "$f"
          if ! grep -Eiq 'openApp[a-z]*"?[[:space:]]*[:=][[:space:]]*(true|1)' "$f"; then
            echo "::error::$f: openAppWhenRun true değil ya da yok"
            grep -io '"openapp[^,]*' "$f" || true
            exit 1
          fi
          test -f build/ios/iphoneos/Runner.app/PrivacyInfo.xcprivacy
      # The home-screen widget has no Xcode target yet (see
      # ios/PamnotWidget/README.md), so type-check its Swift sources directly
      # at the app's minimum iOS version.
      - name: Type-check the widget extension
        run: |
          xcrun --sdk iphoneos swiftc -typecheck -parse-as-library \
            -target arm64-apple-ios16.0 \
            ios/PamnotWidget/*.swift

  windows:
    name: Windows app
    needs: checks
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full-build]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pamnot-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
